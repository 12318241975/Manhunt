<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Manhunt">
<title>Manhunt</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#eef1ea;--ink:#17231c;--ok:#2b7a4b}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{font:16px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#home{max-width:420px;margin:0 auto;padding:32px 20px}
h1{font-size:2rem;margin:0 0 4px}
p.sub{margin:0 0 24px;color:#4a5a50}
label{display:block;font-weight:600;margin:16px 0 6px}
label span{font-weight:400;color:#4a5a50;font-size:.85rem}
input{width:100%;padding:12px;font-size:1.1rem;border:2px solid var(--ink);border-radius:6px;background:#fff;text-transform:uppercase}
#name{text-transform:none}
.row{display:flex;gap:10px;margin-top:10px}
button{flex:1;padding:14px;font-size:1rem;font-weight:700;border:2px solid var(--ink);border-radius:6px;background:#fff;color:var(--ink)}
button.run{background:#e8590c;color:#fff;border-color:#e8590c}
button.hunt{background:var(--ink);color:#fff}
#err{color:#b00020;min-height:1.4em;margin-top:12px}
#ver{margin-top:28px;font-size:.8rem;color:#6b7a70}
#game{height:100%;display:flex;flex-direction:column}
#bar{padding:10px 14px;background:var(--ink);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:10px}
#bar.live{background:var(--ok)}
#bar button{flex:none;padding:8px 14px;background:#fff}
#bar .btns{display:flex;gap:8px}
#legend{display:flex;flex-wrap:wrap;gap:6px;padding:6px 10px;background:#fff;border-bottom:2px solid var(--ink)}
#legend:empty{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:5px 12px;font-size:.9rem;font-weight:600;border:2px solid var(--ink);border-radius:99px;background:#fff}
.chip i{width:12px;height:12px;border-radius:50%;display:inline-block}
#map{flex:1}
.me{width:40px;height:40px;transform-origin:50% 55%;transition:transform .2s}
.me .hd{opacity:0}
.me.has .hd{opacity:1}
</style>
</head>
<body>
<section id="home">
  <h1>Manhunt</h1>
  <p class="sub">Runners share a location ping every 2 minutes. Hunters watch the map.</p>
  <label for="code">Room code</label>
  <input id="code" maxlength="6" autocomplete="off" placeholder="e.g. K7QX">
  <div class="row"><button id="gen">New code</button></div>
  <label for="name">Your name <span>(optional, hunters see it if you run)</span></label>
  <input id="name" maxlength="12" autocomplete="off" placeholder="e.g. Sam">
  <div class="row">
    <button class="run" id="runner">I'm a runner</button>
    <button class="hunt" id="hunter">I'm a hunter</button>
  </div>
  <div id="err"></div>
  <div id="ver">Version 6</div>
</section>

<section id="game" hidden>
  <div id="bar"><span id="status"></span><div class="btns"><button id="compass" hidden>Compass</button><button id="center">Me</button><button id="stop">Leave</button></div></div>
  <div id="legend"></div>
  <div id="map"></div>
</section>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyB0olMLfvD01VFpVoBpPP6EvaFsuBcyfAY",
  authDomain: "manhunt-v3.firebaseapp.com",
  projectId: "manhunt-v3",
  appId: "1:55593863408:web:65b47ee72f635581d5da35"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const INTERVAL = 120000;
const AVG_WINDOW = 12000;    // ms of GPS readings averaged into each ping
const PALETTE = [
  { name: 'Red', hex: '#d62828' }, { name: 'Orange', hex: '#f77f00' }, { name: 'Gold', hex: '#a67c00' },
  { name: 'Green', hex: '#2b9348' }, { name: 'Teal', hex: '#0f8b8d' }, { name: 'Purple', hex: '#7b2cbf' },
  { name: 'Pink', hex: '#e5389b' }, { name: 'Brown', hex: '#7f5539' }
];
const needsCompassTap = typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function';

let role, room, map, tick, pinger, unsub, wakeLock, firstFix = true, lastTs = 0, session = 0;
let myId, myColor, myLabel, myTrail = [], runnersData = {};
let me, watchId, lastHeading = null, compassOn = false, centeredOnMe = false;
let retryTimer, gpsAcc = null, gpsErr = '';
const marks = {};            // runner id -> map layers
const fixes = [];            // recent GPS readings, newest last

$('gen').onclick = () => $('code').value = Math.random().toString(36).slice(2, 6).toUpperCase();
$('runner').onclick = () => start('runner');
$('hunter').onclick = () => start('hunter');
$('stop').onclick = stop;
$('compass').onclick = async () => { await enableCompass(); $('compass').hidden = true; };
$('center').onclick = () => { if (me) map.setView(me.getLatLng(), Math.max(map.getZoom(), 16)); };
$('legend').onclick = e => {
  const b = e.target.closest('[data-id]');
  if (!b) return;
  if (b.dataset.id === 'all') return fitAll();
  const m = marks[b.dataset.id];
  if (m) map.setView(m.dot.getLatLng(), Math.max(map.getZoom(), 16));
};

function setStatus(text, live) {
  $('status').textContent = text;
  $('bar').classList.toggle('live', !!live);
}

function gpsText() {
  if (gpsErr) return ' · ' + gpsErr;
  return gpsAcc != null ? ' · GPS ±' + Math.round(gpsAcc) + ' m' : '';
}

function fmtMS(ms) {
  const s = Math.round(ms / 1000);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

async function start(r) {
  const code = $('code').value.trim().toUpperCase();
  if (!code) { $('err').textContent = 'Enter or generate a room code first.'; return; }
  if (r === 'runner' && !navigator.geolocation) { $('err').textContent = 'This browser cannot share location.'; return; }
  role = r;
  const sid = ++session;
  // Android needs no permission. iPhone asks for motion access, which has its own button so it never competes with the location prompt.
  if (needsCompassTap) $('compass').hidden = false; else enableCompass();
  room = db.collection('rooms').doc(code);
  $('home').hidden = true;
  $('game').hidden = false;
  initMap();
  watchMe();

  if (role === 'runner') {
    setStatus('Joining…', true);
    try { await joinAsRunner(); } catch (e) { setStatus('Could not join: ' + e.message, true); return; }
    if (sid !== session) return;
    $('bar').style.background = myColor;
    keepAwake();
    tick = setInterval(() => setStatus((lastTs ? 'Sharing as ' + myLabel + ' · next ping in ' + fmtMS(Math.max(0, lastTs + INTERVAL - Date.now())) : 'Getting a GPS fix…') + gpsText(), true), 1000);
    await firstPing(sid);
    if (sid !== session) return;
    pinger = setInterval(ping, INTERVAL);
  } else {
    setStatus('Waiting for the runners…');
    unsub = room.onSnapshot(snap => {
      runnersData = (snap.data() || {}).runners || {};
      renderRunners();
    }, e => setStatus('Connection error: ' + e.message));
    tick = setInterval(updateHunterUi, 1000);
  }
}

// Each runner gets a random color nobody else in the room is using
async function joinAsRunner() {
  const snap = await room.get();
  const runners = (snap.exists && snap.data().runners) || {};
  const used = Object.values(runners).filter(x => x.active).map(x => x.color);
  const free = PALETTE.filter(c => !used.includes(c.hex));
  const pool = free.length ? free : PALETTE;
  const c = pool[Math.floor(Math.random() * pool.length)];
  myId = Math.random().toString(36).slice(2, 8);
  myColor = c.hex;
  myLabel = $('name').value.trim() || c.name;
  myTrail = [];
  await room.set({ runners: { [myId]: { label: myLabel, color: myColor, active: true, last: null, trail: [] } } }, { merge: true });
}

function initMap() {
  if (!map) {
    map = L.map('map').setView([20, 0], 2);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);
  }
  setTimeout(() => map.invalidateSize(), 50);
  Object.keys(marks).forEach(removeMark);
  firstFix = true;
  centeredOnMe = false;
  lastTs = 0;
}

function removeMark(id) {
  const m = marks[id];
  if (!m) return;
  map.removeLayer(m.dot); map.removeLayer(m.ring); map.removeLayer(m.line);
  delete marks[id];
}

function drawRunner(id, r) {
  const ll = [r.last.lat, r.last.lng];
  let m = marks[id];
  if (!m) {
    m = marks[id] = {
      dot: L.circleMarker(ll, { radius: 10, color: '#fff', weight: 3, fillColor: r.color, fillOpacity: 1 }).addTo(map),
      ring: L.circle(ll, { radius: r.last.acc || 0, color: r.color, weight: 1, fillOpacity: 0.12 }).addTo(map),
      line: L.polyline([], { color: r.color, weight: 3, dashArray: '6 8' }).addTo(map)
    };
    m.dot.bindTooltip(esc(r.label), { permanent: true, direction: 'top', offset: [0, -10] });
  }
  m.dot.setLatLng(ll);
  m.ring.setLatLng(ll).setRadius(r.last.acc || 0);
  m.line.setLatLngs((r.trail || []).map(p => [p.lat, p.lng]));
}

function fitAll() {
  const pts = Object.values(marks).map(m => m.dot.getLatLng());
  if (me) pts.push(me.getLatLng());
  if (pts.length) map.fitBounds(pts, { padding: [60, 60], maxZoom: 17 });
}

function afterDraw() {
  if (firstFix && Object.keys(marks).length) { firstFix = false; fitAll(); }
}

// Hunter view: draw every active runner that has pinged at least once
function renderRunners() {
  for (const id of Object.keys(marks)) {
    const r = runnersData[id];
    if (!r || !r.last || r.active === false) removeMark(id);
  }
  for (const [id, r] of Object.entries(runnersData)) {
    if (r.last && r.active !== false) drawRunner(id, r);
  }
  afterDraw();
  updateHunterUi();
}

function updateHunterUi() {
  const ids = Object.keys(runnersData).filter(id => runnersData[id].active !== false);
  setStatus((ids.length ? 'Hunting · ' + ids.length + (ids.length === 1 ? ' runner' : ' runners') : 'Waiting for the runners…') + gpsText());
  const now = Date.now();
  const chips = ids.map(id => {
    const r = runnersData[id];
    let info = 'waiting';
    if (r.last) {
      const left = r.last.ts + INTERVAL - now;
      info = left > -20000 ? 'next ' + fmtMS(Math.max(0, left)) : Math.round((now - r.last.ts) / 60000) + ' min ago';
    }
    return '<button class="chip" data-id="' + id + '"><i style="background:' + esc(r.color) + '"></i>' + esc(r.label) + ' · ' + info + '</button>';
  });
  $('legend').innerHTML = chips.length ? '<button class="chip" data-id="all">All</button>' + chips.join('') : '';
}

async function firstPing(sid) {
  // Wait for a decent GPS fix so the very first ping is not a rough cell/Wi-Fi guess
  const t0 = Date.now();
  while (sid === session) {
    const waited = Date.now() - t0;
    const good = fixes.some(f => Date.now() - f.t < 3000 && f.acc <= 30);
    if ((good && waited >= 6000) || waited >= 20000) break;
    await new Promise(r => setTimeout(r, 500));
  }
  if (sid === session) await ping();
}

async function ping() {
  const now = Date.now();
  let recent = fixes.filter(f => now - f.t <= AVG_WINDOW);
  if (!recent.length) {
    gpsErr = 'no recent GPS reading, retrying';
    clearTimeout(retryTimer);
    retryTimer = setTimeout(ping, 10000);
    return;
  }
  // Drop the rough readings, then average the rest, trusting accurate ones more
  const best = Math.min(...recent.map(f => f.acc));
  recent = recent.filter(f => f.acc <= Math.max(best * 2, 15));
  let w = 0, lat = 0, lng = 0;
  for (const f of recent) { const k = 1 / (f.acc * f.acc); w += k; lat += f.lat * k; lng += f.lng * k; }
  const pt = { lat: lat / w, lng: lng / w, acc: Math.round(best), ts: Date.now() };
  lastTs = pt.ts;
  myTrail.push(pt);
  drawRunner(myId, { label: myLabel, color: myColor, last: pt, trail: myTrail });
  afterDraw();
  const k = 'runners.' + myId;
  try {
    await room.update({ [k + '.active']: true, [k + '.last']: pt, [k + '.trail']: firebase.firestore.FieldValue.arrayUnion(pt) });
  } catch (e) { setStatus('Could not send ping: ' + e.message, true); }
}

// Your own position and facing direction. Shown only on your own screen, never sent to Firebase.
function meIcon() {
  return L.divIcon({
    className: '', iconSize: [40, 40], iconAnchor: [20, 22],
    html: '<div class="me"><svg viewBox="0 0 40 40" width="40" height="40">' +
      '<path class="hd" d="M20 1 L28 15 L20 11 L12 15 Z" fill="#1d4ed8" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>' +
      '<circle cx="20" cy="22" r="7" fill="#1d4ed8" stroke="#fff" stroke-width="3"/></svg></div>'
  });
}

function applyHeading() {
  if (!me || lastHeading == null || !me.getElement()) return;
  const el = me.getElement().firstChild;
  el.classList.add('has');
  el.style.transform = 'rotate(' + lastHeading + 'deg)';
}

function watchMe() {
  if (!navigator.geolocation) { gpsErr = 'no GPS in this browser'; return; }
  watchId = navigator.geolocation.watchPosition(p => {
    const ll = [p.coords.latitude, p.coords.longitude];
    gpsAcc = p.coords.accuracy; gpsErr = '';
    fixes.push({ lat: ll[0], lng: ll[1], acc: p.coords.accuracy || 999, t: Date.now() });
    while (fixes.length && Date.now() - fixes[0].t > 30000) fixes.shift();
    // Live dot: always your real, current position (never delayed)
    if (!me) me = L.marker(ll, { icon: meIcon(), interactive: false, zIndexOffset: 1000 }).addTo(map);
    else me.setLatLng(ll);
    if (!centeredOnMe) { centeredOnMe = true; if (firstFix) map.setView(ll, 16); }
    // Fallback when there is no compass: use direction of travel while moving
    if (!compassOn && typeof p.coords.heading === 'number' && !isNaN(p.coords.heading) && (p.coords.speed || 0) > 0.5) {
      lastHeading = p.coords.heading;
    }
    applyHeading();
  }, e => { gpsErr = e.code === 1 ? 'location blocked, check Safari site settings' : 'GPS error: ' + e.message; },
  { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 });
}

function onOrient(e) {
  let h = null;
  if (typeof e.webkitCompassHeading === 'number') h = e.webkitCompassHeading;   // iPhone
  else if (e.absolute && typeof e.alpha === 'number') h = 360 - e.alpha;         // Android
  if (h == null) return;
  compassOn = true;
  lastHeading = h;
  applyHeading();
}

async function enableCompass() {
  try {
    if (needsCompassTap && await DeviceOrientationEvent.requestPermission() !== 'granted') return;
    window.addEventListener('deviceorientationabsolute', onOrient, true);
    window.addEventListener('deviceorientation', onOrient, true);
  } catch (e) {}
}

async function keepAwake() {
  try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
  if (role === 'runner' && pinger && document.visibilityState === 'visible') { keepAwake(); ping(); }
});

async function stop() {
  session++; clearTimeout(retryTimer);
  clearInterval(pinger); clearInterval(tick); pinger = null;
  if (unsub) { unsub(); unsub = null; }
  if (watchId != null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  window.removeEventListener('deviceorientationabsolute', onOrient, true);
  window.removeEventListener('deviceorientation', onOrient, true);
  if (me && map) { map.removeLayer(me); }
  me = null; lastHeading = null; compassOn = false;
  fixes.length = 0; gpsAcc = null; gpsErr = '';
  $('compass').hidden = true;
  $('bar').style.background = '';
  if (wakeLock) { try { await wakeLock.release(); } catch (e) {} wakeLock = null; }
  if (role === 'runner' && room && myId) {
    try { await room.update({ ['runners.' + myId + '.active']: false }); } catch (e) {}
  }
  Object.keys(marks).forEach(removeMark);
  runnersData = {}; myId = null; myTrail = [];
  $('legend').innerHTML = '';
  $('game').hidden = true;
  $('home').hidden = false;
  $('err').textContent = '';
}
</script>
</body>
</html>
